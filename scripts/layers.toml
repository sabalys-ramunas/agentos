# The layer order of src/agentos, top to bottom (docs/ARCHITECTURE.md, "Layers"). A module may import
# its own layer and the layers below it, never one above, and packages on one layer must not import
# each other in a circle. Checked by scripts/layers.py (`make layers`, part of `make lint`).
#
# Members are top-level packages ("node"), or module patterns that put some modules of a package on
# another layer than the package ("*.cli": every package's CLI is an entry point). A pattern wins
# over its package.

[[layer]]
name = "entry points"
members = ["cli", "commands", "cli_groups", "lanebench_cli", "qr", "tui", "client", "dev", "controller",
  "*.cli", "*_cli", "*.__main__", "node.daemon", "runner.flowcli", "runner.flowsync"]

# node.channel is the controller's API into the node: the surface a controller (agentos.controller, or the
# hosted cloud) calls over its websocket, as the panel calls api/ and agents call mcp/. Like them it relays
# what features do (workflow runs, logs, the doctor's checks, approvals) and sits above them; nothing below
# it imports it (the anchors service sends through the channel object the runtime holds).
[[layer]]
name = "surfaces"
members = ["api", "mcp", "*.api", "*.form", "*.forms", "*.login_form", "runner.siteapis.http", "node.channel"]

[[layer]]
name = "features"
members = ["environments", "studio", "profiles", "brains", "memory", "runner", "agenda", "pilot", "keepalive",
  "workspaces", "textreview", "plugins", "webhooks", "events", "agents", "ops", "freeze", "audit"]

[[layer]]
name = "node runtime"
members = ["node", "env", "vms", "git", "stealth", "vault", "webbotauth", "runas"]

[[layer]]
name = "safety"
members = ["policy"]

[[layer]]
name = "core"
members = ["core", "agentos"]

# Imports that still break the order, each with why it is still here. This list may only shrink:
# fix one (move the code to its layer, put a shared type or Protocol lower, pass a callback in) and
# delete its line. Never add one. A line nothing matches any more fails the check.
[exceptions]
"agentos.node.devices -> agentos.stealth.stealth" = "a device move warns with stealth's location check (location_check, _exit_geo, which use stealth.lanerules); move that check into node or below it"
"agentos.node.tools.lanes -> agentos.environments.tools" = "whoami reads the chat's environment with environments.tools.bound_environment (the call's binding and grant family); give the environments service a method that takes the call"
"agentos.node.viewer_app -> agentos.api.auth" = "the viewer checks the panel session (SESSION_COOKIE, PanelStore, presence_of); move the panel's session store (api/auth.py, 118 importers) below the API"
"agentos.policy.wrap -> agentos.environments.routing" = "the policy wrapper routes calls to the chat's environment; move the rules into policy and have the environments service route, which also moves NoEnvironment below environments"
