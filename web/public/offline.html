<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <title>Offline · agentos</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #171717; --muted: #525252; --line: #ebebeb; --fill: rgb(0 0 0 / 3.5%); }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #ededed; --muted: #a1a1a1; --line: #232323; --fill: rgb(255 255 255 / 5%); } }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px;
        background: var(--bg); color: var(--fg);
        font: 400 14px/20px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.006em;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 360px; }
      svg { display: block; width: 32px; height: 32px; margin-bottom: 24px; }
      h1 { margin: 0 0 8px; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; color: var(--muted); }
      a {
        display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px;
        border: 1px solid var(--line); border-radius: 8px; color: var(--fg); font-weight: 500; text-decoration: none;
        transition: background-color 150ms cubic-bezier(0.2, 0, 0, 1);
      }
      a:hover { background: var(--fill); }
      a:focus-visible { outline: 2px solid #0a66d6; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#db2777" /><path fill="#fff" d="M28.6 16h6.8l12 32h-6.6l-2.8-7.8H26l-2.8 7.8h-6.6l12-32Zm-.8 19h8.4L32 23.2 27.8 35Z" /></svg>
      <h1>You are offline</h1>
      <p>agentos needs a connection to show your agents and what waits for you. Nothing is decided while you are away, and approvals keep until you are back.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
