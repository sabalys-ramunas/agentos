<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="How agentos works: you ask your agent, agentos gives it its own cloud computer, and it comes back with proof and a pull request.">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#98a2b3"/></marker>
  </defs>

  <!-- 1. you ask -->
  <g transform="translate(10,20)">
    <rect width="270" height="290" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
    <circle cx="34" cy="36" r="15" fill="#eef2ff"/><text x="34" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">1</text>
    <text x="58" y="41" font-size="17" font-weight="650" fill="#101828">You ask your agent</text>
    <rect x="20" y="70" width="230" height="150" rx="12" fill="#f2f4f7"/>
    <rect x="62" y="86" width="176" height="52" rx="12" fill="#4f46e5"/>
    <text x="76" y="107" font-size="13" fill="#ffffff">In agentos: fix the</text>
    <text x="76" y="125" font-size="13" fill="#ffffff">checkout bug, show me.</text>
    <rect x="32" y="152" width="150" height="52" rx="12" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="46" y="173" font-size="13" fill="#101828">On it. Opening a</text>
    <text x="46" y="191" font-size="13" fill="#101828">computer for this.</text>
    <text x="135" y="252" text-anchor="middle" font-size="13" fill="#667085">Claude Code, Codex or T3 Code,</text>
    <text x="135" y="270" text-anchor="middle" font-size="13" fill="#667085">on your laptop as today</text>
  </g>

  <path d="M290 165H330" stroke="#98a2b3" stroke-width="2.5" marker-end="url(#head)"/>

  <!-- 2. it gets a computer -->
  <g transform="translate(345,20)">
    <rect width="270" height="290" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
    <circle cx="34" cy="36" r="15" fill="#ecfeff"/><text x="34" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">2</text>
    <text x="58" y="41" font-size="17" font-weight="650" fill="#101828">It gets its own computer</text>
    <rect x="20" y="70" width="230" height="150" rx="12" fill="#f2f4f7"/>
    <circle cx="38" cy="86" r="4" fill="#98a2b3"/><circle cx="52" cy="86" r="4" fill="#98a2b3"/><circle cx="66" cy="86" r="4" fill="#98a2b3"/>
    <text x="236" y="90" text-anchor="end" font-size="12" fill="#667085">fresh VM</text>
    <g font-size="14" fill="#101828">
      <rect x="34" y="104" width="202" height="30" rx="8" fill="#ffffff"/>
      <text x="48" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0e7490">&gt;_</text><text x="78" y="124">a terminal</text>
      <rect x="34" y="140" width="202" height="30" rx="8" fill="#ffffff"/>
      <circle cx="56" cy="155" r="7" fill="none" stroke="#0e7490" stroke-width="2"/><text x="78" y="160">a real browser</text>
      <rect x="34" y="176" width="202" height="30" rx="8" fill="#ffffff"/>
      <path d="M50 184v14M50 191h8a4 4 0 0 0 4-4v-3" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round"/><text x="78" y="196">your repository</text>
    </g>
    <text x="135" y="252" text-anchor="middle" font-size="13" fill="#667085">Ready in about two minutes, only</text>
    <text x="135" y="270" text-anchor="middle" font-size="13" fill="#667085">when the agent asks for one</text>
  </g>

  <path d="M625 165H665" stroke="#98a2b3" stroke-width="2.5" marker-end="url(#head)"/>

  <!-- 3. it comes back with proof -->
  <g transform="translate(680,20)">
    <rect width="270" height="290" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
    <circle cx="34" cy="36" r="15" fill="#ecfdf3"/><text x="34" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#067647">3</text>
    <text x="58" y="41" font-size="17" font-weight="650" fill="#101828">You get the result</text>
    <rect x="20" y="70" width="230" height="150" rx="12" fill="#f2f4f7"/>
    <rect x="34" y="84" width="110" height="76" rx="8" fill="#e0e7ff"/>
    <rect x="44" y="94" width="60" height="8" rx="4" fill="#c7d2fe"/>
    <rect x="44" y="110" width="88" height="6" rx="3" fill="#c7d2fe"/>
    <rect x="44" y="122" width="70" height="6" rx="3" fill="#c7d2fe"/>
    <rect x="44" y="138" width="40" height="12" rx="4" fill="#4f46e5"/>
    <text x="156" y="104" font-size="12" fill="#667085">screenshot</text>
    <text x="156" y="120" font-size="12" fill="#667085">as proof</text>
    <rect x="34" y="174" width="202" height="32" rx="16" fill="#ecfdf3"/>
    <circle cx="54" cy="190" r="6" fill="#067647"/>
    <text x="68" y="195" font-size="13" font-weight="600" fill="#067647">Pull request ready</text>
    <text x="135" y="252" text-anchor="middle" font-size="13" fill="#667085">Then the VM is deleted, or kept</text>
    <text x="135" y="270" text-anchor="middle" font-size="13" fill="#667085">until tomorrow for cents a month</text>
  </g>
</svg>
