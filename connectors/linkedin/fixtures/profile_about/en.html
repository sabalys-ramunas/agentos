<!-- The About section follows an anchor div#about; its pencil opens a dialog with one text box. A profile with no

  <section class="pv-top-card"><h1>Ada Lovelace</h1></section>
  <section>
    <div id="about"></div>
    <h2>About</h2>
    <button aria-label="Edit about">Edit</button>
    <div class="inline-show-more-text"><span aria-hidden="true">Notes on the analytical engine.</span></div>
  </section>
</main>
<div role="dialog" aria-label="Edit about">
  <textarea aria-label="Summary">Notes on the analytical engine.</textarea>
  <button>Save</button>
</div>
