name: Bug report
description: Something does not work as the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste tokens, cookies, passwords, proxy credentials
        or real account names. For a security problem, use SECURITY.md instead of an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or tool calls, in order. `openajar dev up --seed` is a good place to reproduce.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error messages, the error code, or `openajar doctor` output (scrub anything private).
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: "`openajar version`, and the commit if you run from a checkout."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - Environment (Docker provider)
        - Environment (Hetzner Cloud)
        - Linux node (systemd install)
        - Linux node (dev install)
        - Mac (openajar connect)
        - Laptop (openajar dev up)
        - Controller
        - Other
    validations:
      required: true
