name: web-release

# The web app, prebuilt for each release, so `agentos web install` (and the web step of `agentos setup`)
# downloads it instead of needing Node.js and pnpm (agentos.setup.webapp). Published on the release as
# agentos-web-<version>.tar.gz and agentos-web-<version>.tar.gz.sha256: the installer takes both from
# the release of the agentos it runs (v<version>), and refuses the archive when its sha256 differs.
#
# It runs when a release is published (docs/DEVELOPING.md, "Releases"), or by hand for a release that
# exists already (Actions > web-release > Run workflow, with its tag): the build is in live mode,
# since `vite build` refuses the mock, and scripts/web_asset.py checks the folder again before packing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build and attach the web app to (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build and attach the web app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # gh release upload
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Version (the tag's, and it must be the code's)
        id: v
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$TAG is not a vX.Y.Z tag"; exit 1 ;; esac
          v="${TAG#v}"
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/agentos/__init__.py)
          [ "$v" = "$code" ] || { echo "::error::the tag is $v but src/agentos/__init__.py says $code"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # pnpm at the version that wrote web/pnpm-lock.yaml, through corepack (no third-party action).
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Build (live mode; web/.env.production)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Pack (scripts/web_asset.py, as `make web-asset` runs it)
        run: python3 scripts/web_asset.py --dist web/dist --version "${{ steps.v.outputs.version }}" --out dist-release
      - name: Check the archive unpacks the way agentos web install unpacks it
        run: |
          cd dist-release
          sha256sum -c "agentos-web-${{ steps.v.outputs.version }}.tar.gz.sha256"
          tar tzf "agentos-web-${{ steps.v.outputs.version }}.tar.gz" | grep -qx index.html
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist-release/* --clobber --repo "${{ github.repository }}"
