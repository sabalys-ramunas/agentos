protocols = imap lmtp
listen = *
log_path = /dev/stderr
ssl = required
ssl_cert = </etc/ssl/mailtest/server.crt
ssl_key = </etc/ssl/mailtest/server.key
disable_plaintext_auth = yes
auth_mechanisms = plain login
mail_location = maildir:/var/mail/%n
mail_uid = vmail
mail_gid = postdrop
first_valid_uid = 1

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=postdrop home=/var/mail/%n
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0660
    user = postfix
    group = postfix
  }
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
}
