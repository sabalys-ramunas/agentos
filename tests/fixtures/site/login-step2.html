<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture login, step 2</title>
  <link rel="stylesheet" href="/style.css">
  <style>input { font-size: 15px; padding: 4px; width: 320px; }</style>
</head>
<body>
  <main>
    <h1>Enter your password</h1>
    <form id="challenge" action="/login/submit?next=/login-done.html" method="post">
      <label for="passwd">Password</label>
      <input id="passwd" name="passwd" type="password" autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
