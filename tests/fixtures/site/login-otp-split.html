<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture one-time code, one box per digit</title>
  <link rel="stylesheet" href="/style.css">
  <style>.digits input { font-size: 20px; width: 32px; text-align: center; margin-right: 6px; }</style>
</head>
<body>
  <main>
    <h1>Enter the 6-digit code</h1>
    <form id="verify" action="/login/submit?next=/login-done.html" method="post">
      <div class="digits">
        <input name="d1" aria-label="Digit 1" type="text" inputmode="numeric" maxlength="1">
        <input name="d2" aria-label="Digit 2" type="text" inputmode="numeric" maxlength="1">
        <input name="d3" aria-label="Digit 3" type="text" inputmode="numeric" maxlength="1">
        <input name="d4" aria-label="Digit 4" type="text" inputmode="numeric" maxlength="1">
        <input name="d5" aria-label="Digit 5" type="text" inputmode="numeric" maxlength="1">
        <input name="d6" aria-label="Digit 6" type="text" inputmode="numeric" maxlength="1">
      </div>
      <button type="submit">Verify</button>
    </form>
  </main>
  <script>
    // Like many sites: a digit moves focus on to the next box.
    const boxes = Array.from(document.querySelectorAll('.digits input'));
    boxes.forEach((box, i) => box.addEventListener('input', () => {
      if (box.value && boxes[i + 1]) boxes[i + 1].focus();
    }));
  </script>
</body>
</html>
