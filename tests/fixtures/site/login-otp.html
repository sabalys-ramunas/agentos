<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture one-time code</title>
  <link rel="stylesheet" href="/style.css">
  <style>input { font-size: 15px; padding: 4px; width: 160px; }</style>
</head>
<body>
  <main>
    <h1>Two-step verification</h1>
    <form id="verify" action="/login/submit?next=/login-done.html" method="post">
      <label for="otp">Code from your authenticator app</label>
      <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <button type="submit">Verify</button>
    </form>
  </main>
</body>
</html>
