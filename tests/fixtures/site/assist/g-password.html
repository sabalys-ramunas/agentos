<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in - Google Accounts</title>
<style>body{font:15px sans-serif;margin:40px} input{display:block;margin:8px 0;width:300px;height:34px}</style></head>
<body>
<form onkeydown="if (event.key === 'Enter') { event.preventDefault(); this.submit(); }" method="post" action="/v3/signin/challenge/pwd">
  <h1>Welcome</h1>
  <div>Enter your password to go on to your Google Account.</div>
  <input type="email" name="identifier" value="" style="display:none" aria-hidden="true" tabindex="-1">
  <input type="password" name="Passwd" autocomplete="current-password" aria-label="Enter your password">
  <label><input type="checkbox" name="show" style="display:inline;width:auto;height:auto"> Show password</label>
  <button type="button">Forgot password?</button>
  <button type="button" onclick="this.form.submit()">Next</button>
</form>
</body></html>
