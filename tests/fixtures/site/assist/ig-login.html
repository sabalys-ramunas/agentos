<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Instagram</title>
<style>body{font:15px sans-serif;margin:40px} input{display:block;margin:8px 0;width:260px;height:30px} button{margin:6px 0;height:32px}</style></head>
<body>
<main>
  <h1>Instagram</h1>
  <form method="post" action="/accounts/login/">
    <label>Phone number, username, or email<input name="username" type="text" maxlength="75" autocapitalize="off"></label>
    <label>Password<input name="password" type="password"></label>
    <button type="submit">Log in</button>
    <button type="button" class="facebook-login">Log in with Facebook</button>
  </form>
  <p>Don't have an account? Sign up for one today, it only takes a minute.</p>
</main>
</body></html>
