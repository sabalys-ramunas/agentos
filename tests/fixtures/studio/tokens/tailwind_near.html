<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tailwind v4, on the system</title>
<style>
  /* Near misses from the first run on a real app (agentos's web app): every value here is on the
     system. The app's own variables sit beside Tailwind's theme and hold both themes in
     light-dark(); utilities use half steps of the spacing scale, a 50% dot, a pill, sr-only text
     (margin -1px), px line heights from a type scale, a ring drawn as a box-shadow padded with
     Tailwind's empty layers, and a transparent border that only keeps the size. */
  :root {
    color-scheme: light dark;
    --background: light-dark(#ffffff, #0a0a0a);
    --foreground: light-dark(#171717, #ededed);
    --foreground-subtle: light-dark(#6b6b6b, #8f8f8f);
    --border: light-dark(#ebebeb, #232323);
    --type-12: 12px;
    --type-12-line: 16px;
    --type-14: 14px;
    --type-14-line: 20px;
    --shadow-card: 0 1px 2px rgb(0 0 0 / 0.05);
  }
  @layer theme {
    :root, :host {
      --spacing: 0.25rem;
      --font-sans: Arial, Helvetica, sans-serif;
      --radius-md: 0.375rem;
      --leading-tight: 1.25;
    }
  }
  @layer base {
    html { font-family: var(--font-sans); }
    body { margin: 0; background: var(--background); color: var(--foreground); }
    p, div, span, ul, li { margin: 0; padding: 0; }
  }
  @layer utilities {
    .p-1\.5 { padding: calc(var(--spacing) * 1.5); }
    .gap-0\.5 { gap: calc(var(--spacing) * 0.5); }
    .px-2\.5 { padding-inline: calc(var(--spacing) * 2.5); }
    .p-px { padding: 1px; }
    .p-3 { padding: calc(var(--spacing) * 3); }
    .flex { display: flex; }
    .rounded-full { border-radius: calc(infinity * 1px); }
    .rounded-md { border-radius: var(--radius-md); }
    .border { border: 1px solid var(--border); }
    .text-12 { font-size: var(--type-12); line-height: var(--tw-leading, var(--type-12-line)); }
    .text-14 { font-size: var(--type-14); line-height: var(--tw-leading, var(--type-14-line)); }
    .text-faint { color: var(--foreground-subtle); }
    .shadow-card { box-shadow: var(--shadow-card); }
    .ring-1 { box-shadow: 0 0 #0000, 0 0 #0000, 0 0 0 1px rgb(0 0 0 / 0.08); }
    .border-transparent { border: 1px solid transparent; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; border-width: 0; }
  }
  /* by hand, but shapes: a round dot and a pill are on any system */
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--foreground-subtle); }
  .tag { border-radius: 9999px; }
</style>
</head>
<body>
  <div class="p-3 text-14">
    <div class="flex gap-0.5 p-1.5 rounded-md border"><span class="dot"></span><span class="text-12 text-faint">Live</span></div>
    <span class="px-2.5 rounded-full border text-12">Beta</span>
    <div class="p-3 rounded-md shadow-card"><span class="p-px border text-12">1</span><span class="px-2.5 rounded-md ring-1 border-transparent text-12">Ringed</span></div>
    <span class="px-2.5 tag border text-12">New<span class="sr-only"> feature</span></span>
    <a class="sr-only" href="#main">Skip to content</a>
  </div>
</body>
</html>
