<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Pictures of pages</title><style>
.shop { width: 300px; padding: 8px; background: #fafafa; border: 1px solid #ddd; }
.shop p { color: #bbb; margin: 0 0 4px; }
.shop .cut { width: 80px; white-space: nowrap; overflow: hidden; }
.shop button { font-size: 10px; padding: 2px; min-height: 0; }
.thumb { width: 300px; height: 40px; overflow: hidden; border: 1px solid #ddd; }
.thumb > div { transform: scale(0.12); transform-origin: 0 0; width: 2400px; }
.thumb p { color: #ccc; font-size: 16px; }
</style></head>
<body><h2>Two directions</h2>
<div class="shop" role="img" aria-label="The shop's checkout page, drawn"><p>Street and house number</p><p class="cut">Postcode and the city it is in</p><button>Pay</button></div>
<div class="shop" inert><p>Delivery to a pick-up point</p><p class="cut">Choose a pick-up point near you</p><button>Change</button></div>
<div class="thumb"><div><p>Amazon order history, page one of the drawn thumbnail</p></div></div>
</body></html>
