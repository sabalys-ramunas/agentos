<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Small text over dots, gradients and blur</title><style>
/* Every text here passes WCAG AA on what is really behind it. Read from pixels alone, small text
   reads far lower: at the core of an 11 px glyph the pixel is still part background. */
.stage { background: #fafafa radial-gradient(circle at 1px 1px, rgba(0, 0, 0, 0.1) 1px, transparent 0) 0 0 / 12px 12px; padding: 16px; }
.stage p { color: #6b6b6b; font-size: 13px; margin: 0; }
.wash { background: linear-gradient(#ffffff, #f2f2f2); padding: 12px; }
.wash p { color: #525252; font-size: 11px; margin: 0; }
.thumb { position: relative; height: 120px; margin-top: 12px; background: url(/img/hero.png) center / cover; }
.pill { position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; height: 24px; padding: 0 8px;
  border-radius: 999px; background: rgb(255 255 255 / 0.9); backdrop-filter: blur(12px); color: #171717; font-size: 12px; font-weight: 500; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; height: 56px; align-items: center;
  background: rgb(255 255 255 / 0.9); backdrop-filter: blur(12px); border-top: 1px solid #ebebeb; }
.tabs a { color: #6b6b6b; font-size: 11px; text-decoration: none; padding: 8px; }
.meta { color: #6b6b6b; font-size: 13px; }
.meta .dot { color: #d4d4d4; padding: 0 4px; }
body { padding-bottom: 80px; }
</style></head>
<body><div class="stage" data-component="Picture"><p>over 5 days</p></div>
<div class="wash" data-component="Wash"><p>Last used 1h ago</p></div>
<div class="thumb" data-component="Thumb"><span class="pill">Mail</span></div>
<p class="meta" data-component="Meta">Meridian Travel<span class="dot">·</span>Facebook<span class="dot">|</span>58m ago</p>
<nav class="tabs" data-component="TabBar"><a href="/">Home</a><a href="/history">History</a><a href="/more">More</a></nav></body></html>
