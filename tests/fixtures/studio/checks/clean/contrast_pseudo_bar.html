<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>A bar at the row's edge</title><style>
.row { position: relative; padding: 8px 8px 8px 16px; font-size: 12px; color: #767676; }
.row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #1d4ed8; }
.row::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 4px; background: #16a34a; }
</style></head>
