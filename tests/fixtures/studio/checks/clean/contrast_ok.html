<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Contrast ok</title><style>
.hero { background: linear-gradient(135deg, #0b1f3a, #24426e); padding: 24px; }
.hero h2 { color: #fff; margin: 0; }
.photo { position: relative; height: 160px; margin-top: 16px; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo p { position: relative; color: #fff; padding: 16px; font-size: 20px; font-weight: 700; }
.soft { opacity: 0.87; }
.alpha { background: rgba(0, 0, 0, 0.05); padding: 8px; }
</style></head>
<body><div class="hero" data-component="Hero"><h2>Night trains</h2></div>
<div class="photo"><img src="/img/dark.png" alt="" width="600" height="450"><p>Sleep your way there.</p></div>
<p class="soft">Slightly softened body text.</p><p class="alpha">Text on a faint tint.</p>
<button disabled style="color:#aaa">Unavailable</button>
<p><input placeholder="Search trains" aria-label="Search trains"></p></body></html>
