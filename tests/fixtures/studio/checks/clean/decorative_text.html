<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Text inside pictures</title><style>
.row { display: flex; gap: 8px; align-items: center; }
.avatar { display: inline-flex; width: 16px; height: 16px; border-radius: 4px; background: #3f9a8c; color: #fff; font-size: 7px;
  font-weight: 600; align-items: center; justify-content: center; overflow: hidden; }
.art { position: relative; width: 140px; height: 90px; background: #f4f4f5; overflow: hidden; }
.art .card { position: absolute; left: 10px; top: 20px; width: 90px; padding: 4px; background: #fff; }
.art .card span { display: block; white-space: nowrap; overflow: hidden; color: #b0b0b0; font-size: 11px; }
.art .card i { position: absolute; left: 40px; top: 6px; width: 60px; height: 20px; background: #e5e7eb; }
</style></head>
<body><div class="row" data-component="Byline"><span class="avatar" aria-hidden="true">M</span><span>Meridian Travel</span></div>
<div class="art" aria-hidden="true" data-component="Illustration"><div class="card"><span>@harbor-reddit-account-name</span><i></i></div></div>
</body></html>
