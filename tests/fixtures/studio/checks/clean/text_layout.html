<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Tight text</title><style>
.title { font-size: 32px; line-height: 1; overflow: hidden; margin: 0 0 8px; }
.pill { display: inline-block; height: 24px; line-height: 24px; overflow: hidden; padding: 0 10px; border-radius: 12px; background: #e8eefc; font-size: 13px; }
.btn { height: 40px; line-height: 1; overflow: hidden; }
.stack h3 { margin: 0; line-height: 1.1; } .stack p { margin: 0; line-height: 1.2; }
.media { position: relative; width: 200px; height: 120px; background: #ccd; }
.media .tag { position: absolute; left: 8px; top: 8px; background: #111; color: #fff; padding: 2px 6px; font-size: 12px; }
</style></head>
<body><h2 class="title" data-component="PageTitle">Quarterly results</h2>
<span class="pill">New</span> <span class="pill">Beta</span>
<p><button class="btn">Download</button></p>
<div class="stack"><h3>Heading</h3><p>Body right under it, H<sub>2</sub>O and x<sup>2</sup>.</p></div>
<div class="media"><span class="tag">Video</span></div></body></html>
