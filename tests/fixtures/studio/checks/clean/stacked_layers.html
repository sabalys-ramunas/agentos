<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Before and after</title><style>
.compare { position: relative; width: 320px; height: 160px; }
.compare > div { position: absolute; inset: 0; background: #ffffff; border: 1px solid #ccc; }
.compare > .after { clip-path: inset(0 0 0 50%); background: #eeeeff; }
.compare p { position: absolute; margin: 0; white-space: nowrap; }
.before p { right: 16px; bottom: 12px; }
.after p { left: 16px; top: 12px; }
</style></head>
<body><h2>The change</h2><div class="compare"><div class="before"><p>Before: 41.99 EUR</p></div><div class="after"><p>After: 42.00 EUR</p></div></div>
<p>Drag to compare.</p>
</body></html>
