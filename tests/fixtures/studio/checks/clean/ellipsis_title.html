<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Deliberate ellipsis</title><style>
table { width: 100%; max-width: 320px; table-layout: fixed; border-collapse: collapse; }
td { padding: 6px; border-bottom: 1px solid #ddd; }
.file { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp { width: 220px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
</style></head>
<body><table data-component="FileTable"><tr><td class="file" title="Quarterly revenue report for the northern region 2026.pdf">Quarterly revenue report for the northern region 2026.pdf</td><td>2 MB</td></tr>
<tr><td class="file" title="Notes.txt">Notes.txt</td><td>1 KB</td></tr></table>
<p class="clamp" aria-label="Hand-stitched leather wallet with six card slots, a coin pocket and a slim profile for front pockets.">Hand-stitched leather wallet with six card slots, a coin pocket and a slim profile for front pockets.</p>
</body></html>
