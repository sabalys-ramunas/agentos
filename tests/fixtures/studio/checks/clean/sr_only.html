<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Screen reader text</title><style>
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.check input { opacity: 0; position: absolute; }
.check span { display: inline-block; padding: 8px 12px; border: 1px solid #888; }
.icon { width: 40px; height: 40px; padding: 0; }
</style></head>
<body><a class="skip" href="#main">Skip to content</a>
<main id="main"><h1>Cart <span class="sr-only">(3 items)</span></h1>
<button class="icon"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h12v12H2z"/></svg><span class="sr-only">Remove item</span></button>
<label class="check"><input type="checkbox"><span>Gift wrap</span></label>
<p><label for="q">Quantity</label> <input id="q" type="number" value="1"></p></main></body></html>
