<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>A shell sized to the viewport</title><style>
body { padding: 0; }
.app { display: grid; grid-template-columns: 96px 1fr; min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: #f4f4f5; padding: 8px; }
.rail .me { margin-top: auto; }
.page { padding: 16px; }
.page section { height: 900px; border-bottom: 1px solid #ddd; }
.hero { height: 50vh; background: #e0e7ff; }
</style></head>
<body><div class="app"><nav class="rail"><a href="#home">Home</a><span class="me">Account</span></nav>
<main class="page"><div class="hero"><h1>Runs</h1></div><section><p>Today</p></section><section><p>Yesterday</p></section></main></div></body></html>
