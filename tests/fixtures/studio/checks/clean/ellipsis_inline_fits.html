<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Short text in an ellipsis box</title><style>
.trunc { display: block; width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.faint { color: #555; }
</style></head>
<body><table><tbody><tr><td><span class="trunc"><span class="title">Checkout tests</span> <span class="faint">· rest</span></span></td></tr></tbody></table>
<p class="trunc"><span>#fafafa</span></p></body></html>
