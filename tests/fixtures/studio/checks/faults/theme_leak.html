<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Theme</title><style>
:root { --bg: #ffffff; --fg: #111111; --surface: #f4f4f5; --brand: #1d4ed8; }
@media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #eeeeee; --surface: #222222; } }
html { background: var(--bg); color: var(--fg); }
.card { background: var(--surface); padding: 12px; margin-bottom: 12px; }
.promo { background: #f4f4f5; padding: 12px; }
</style></head>
<body><div class="card" data-component="Card"><p>Your plan renews soon.</p></div>
<div class="promo" data-component="Promo"><p>Invite a friend.</p></div></body></html>
