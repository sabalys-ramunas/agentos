<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Covered inside a scroll box</title><style>
.box { position: relative; overflow: auto; max-height: 200px; border: 1px solid #ccc; }
.box p { margin: 0; padding: 8px; }
.badge { position: absolute; left: 0; top: 0; width: 240px; height: 40px; background: #c00; }
</style></head>
<body><div class="box"><p id="first">First line of the output, in view</p><p>Second line</p><p>Third line</p><p>Fourth line</p><p>Fifth line</p><p>Sixth line</p><p>Seventh line</p><div class="badge"></div></div></body></html>
