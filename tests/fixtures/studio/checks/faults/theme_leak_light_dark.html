<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Theme with light-dark</title><style>
:root { color-scheme: light dark; --bg: light-dark(#ffffff, #111111); --fg: light-dark(#111111, #eeeeee); --surface: light-dark(#f4f4f5, #222222); }
html { background: var(--bg); color: var(--fg); }
.card { background: var(--surface); padding: 12px; margin-bottom: 12px; }
.promo { background: #f4f4f5; color: #111; padding: 12px; }
</style></head>
<body><div class="card" data-component="Card"><p>Your plan renews soon.</p></div>
<div class="promo" data-component="Promo"><p>Invite a friend.</p></div></body></html>
