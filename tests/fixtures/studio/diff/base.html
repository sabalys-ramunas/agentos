<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plans</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1f2937; background: #ffffff; }
  header { display: flex; gap: 24px; align-items: center; height: 64px; padding: 0 24px; background: #f3f4f6; }
  .logo { font-size: 18px; line-height: 24px; }
  nav { display: flex; gap: 16px; }
  nav a { color: #1f2937; text-decoration: none; font-size: 16px; line-height: 24px; }
  .banner { padding: 12px 24px; font-size: 14px; line-height: 20px; background: #fef3c7; }
  main { padding: 24px; }
  h1 { max-width: 560px; margin: 0 0 16px; font-size: 32px; line-height: 40px; }
  .intro { max-width: 560px; margin: 0 0 24px; font-size: 16px; line-height: 24px; }
  .plans { display: flex; gap: 16px; }
  .card { width: 240px; padding: 16px; border: 1px solid #d1d5db; border-radius: 8px; }
  .card h2 { margin: 0 0 8px; font-size: 20px; line-height: 28px; }
  .card p { margin: 0 0 12px; font-size: 14px; line-height: 20px; }
  .save { padding: 8px 16px; border: 0; border-radius: 6px; font-size: 14px; line-height: 20px;
          color: #ffffff; background: #2563eb; }
  .photo { display: block; margin-top: 24px; }
  footer { padding: 16px 24px; font-size: 14px; line-height: 20px; }
  footer p { margin: 0; }
</style>
</head>
<body>
<!--banner-->
<header>
  <strong class="logo">Acme</strong>
  <nav aria-label="Main"><a href="/">Home</a><a href="/pricing">Pricing</a><a href="/docs">Docs</a><a href="/blog">Blog</a></nav>
</header>
<main>
  <h1>Welcome back</h1>
  <p class="intro">Pick the plan that fits the work.</p>
  <section class="plans" aria-label="Plans">
    <div class="card" data-testid="plan-free"><h2>Free</h2><p>For one person.</p><button class="save">Save</button></div>
    <div class="card" data-testid="plan-pro"><h2>Pro</h2><p>For small teams.</p><button class="save">Save</button></div>
    <div class="card" data-testid="plan-team"><h2>Team</h2><p>For the whole company.</p><button class="save">Save</button></div>
  </section>
  <img class="photo" alt="Team photo" width="320" height="160" src="/photo-a.svg">
</main>
<footer><p>Made with care.</p><!--noise--></footer>
</body>
</html>
