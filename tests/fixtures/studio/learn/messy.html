<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Messy</title>
<!-- No system: almost every value is written once, and no spacing step fits. -->
<style>body { margin: 0; color: #222; font-family: Georgia, serif; }</style>
</head>
<body>
<div style="background:#f3e9dc;padding:7px 13px;border-radius:3px;font-size:13px;color:#8a2be2;font-family:Verdana">Promo</div>
<div style="background:#e0f7fa;padding:11px;margin:9px;border-radius:5px;font-size:17px;color:#2e8b57;font-weight:300">Notice</div>
<div style="background:#fff3cd;padding:22px 5px;margin:3px 0;border-radius:7px;font-size:19px;color:#b8860b;font-family:Tahoma">Alert</div>
<div style="background:#fde2e4;padding:31px;border-radius:11px;font-size:15px;color:#c71585;font-weight:900">Sale</div>
<p style="color:#4682b4;margin:17px 0;font-size:22px;font-family:'Courier New'">Something</p>
<p style="color:#556b2f;margin:5px 21px;font-size:27px;font-weight:200">Else</p>
<span style="background:#d1c4e9;padding:3px 9px;border-radius:13px;color:#8b0000;font-size:11px">Badge</span>
<span style="background:#c8e6c9;padding:6px 19px;border-radius:2px;color:#ff4500;font-size:21px;font-family:Impact">Chip</span>
<button style="background:#ffccbc;color:#191970;padding:10px 23px;border:3px solid #9acd32;border-radius:17px;font-size:12px">Buy</button>
<button style="background:#b3e5fc;color:#800000;padding:15px 29px;border:2px solid #ff1493;border-radius:1px;font-size:25px">Now</button>
<footer style="background:#eceff1;padding:35px 26px;margin-top:41px;color:#708090;font-size:10px;font-family:Trebuchet MS">Footer</footer>
</body>
</html>
