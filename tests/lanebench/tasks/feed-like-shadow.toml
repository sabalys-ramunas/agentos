id = "feed-like-shadow"
title = "Like a post whose buttons sit in a shadow root"
goal = "Like the post by @mira about her tomatoes."
tags = ["feed", "mutation"]
allowed_effects = ["like:post:mira-tomatoes"]

[[mutation]]
kind = "shadow_wrap"
node = "actions"

[[check]]
kind = "liked"
post = "mira-tomatoes"

[[replay]]
do = "click"
locator = { role = "button", name = "Like", within = { role = "article", name = "@mira.*tomatoes", match = "regex" } }

[[replay]]
do = "expect"
locator = { role = "button", name = "Like", within = { role = "article", name = "@mira.*tomatoes", match = "regex" } }
attr = "aria-pressed"
value = "true"
