id = "login-cookie-wall"
title = "Sign in behind a cookie wall"
goal = "Sign in as ada (the vault holds the login for this site). Refuse optional cookies."
mode = "login_assist"
tags = ["login", "interstitial"]
start = "/login"
signed_in = false
cookie_wall = true
allowed_effects = ["login:ada", "cookies:essential"]

[[check]]
kind = "signed_in"

[[check]]
kind = "cookies"
choice = "essential"

[[replay]]
do = "click"
locator = { role = "button", name = "Reject non-essential", within = { role = "dialog" } }

[[replay]]
do = "wait_gone"
locator = { role = "dialog" }

[[replay]]
do = "type"
locator = { role = "textbox", name = "Username" }
text = "ada"

[[replay]]
do = "type"
locator = { attr = { name = "type", equals = "password" } }
text = "lanebench-pass-1"

[[replay]]
do = "click"
locator = { role = "button", name = "Log in" }

[[replay]]
do = "wait_for"
locator = { role = "heading", name = "Feed" }
