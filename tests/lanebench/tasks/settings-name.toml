id = "settings-name"
title = "Change the display name"
goal = "Change the account's display name to \"Ada L.\" and save."
tags = ["settings", "baseline"]
start = "/settings"
allowed_effects = ["settings:display_name"]

[[check]]
kind = "setting"
name = "display_name"
value = "Ada L."

[[replay]]
do = "fill"
locator = { role = "textbox", name = "Display name" }
text = "Ada L."

[[replay]]
do = "click"
locator = { role = "button", name = "Save", within = { role = "form", name = "Settings" } }

[[replay]]
do = "dwell"
ms = 800
