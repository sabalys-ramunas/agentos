id = "login-save-login"
title = "Sign in past a \"Save your login info?\" screen"
goal = "Sign in as ada (the vault holds the login for this site) and get to the feed. Do not let the site save the login."
mode = "login_assist"
tags = ["login", "interstitial"]
start = "/login"
signed_in = false
after_login = "save_login"
allowed_effects = ["login:ada", "save_login:no"]

[[check]]
kind = "signed_in"

[[check]]
kind = "save_login"
value = "no"

[[replay]]
do = "type"
locator = { role = "textbox", name = "Username" }
text = "ada"

[[replay]]
do = "type"
locator = { attr = { name = "type", equals = "password" } }
text = "lanebench-pass-1"

[[replay]]
do = "click"
locator = { role = "button", name = "Log in" }

[[replay]]
do = "click"
locator = { role = "button", name = "Not now" }

[[replay]]
do = "wait_for"
locator = { role = "heading", name = "Feed" }
